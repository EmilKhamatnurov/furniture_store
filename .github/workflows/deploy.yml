name: Deploy

# Запускается при пуше тега версии (v1.2.3) — «изменение версии».
# Можно также запустить вручную из вкладки Actions (Run workflow).
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (ветка или тег) для деплоя"
        required: false
        default: "main"

# Параллельные деплои не нужны — отменяем предыдущий запуск.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH (pull + build + up)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          # Деплоим тот ref, который вызвал workflow (тег vX.Y.Z),
          # либо введённый вручную при ручном запуске.
          envs: GITHUB_REF_NAME
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"

            REF="${GITHUB_REF_NAME}"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              REF="${{ github.event.inputs.ref }}"
            fi
            echo "▶ Deploying ref: $REF"

            git fetch --all --tags --prune
            git checkout --force "$REF"

            # Сборка образов + миграции (one-shot) + запуск app/worker/caddy
            docker compose --profile prod up -d --build

            # Чистим старые образы, чтобы не забивать диск
            docker image prune -f

            echo "▶ Статус сервисов:"
            docker compose --profile prod ps
