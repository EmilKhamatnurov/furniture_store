# =============================================================================
# Furniture Shop — docker-compose
# Local dev: docker compose up -d postgres redis
# Production: docker compose --profile prod up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: furniture_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: furniture_shop
      POSTGRES_USER: furniture_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Run init scripts on first start
      - ./infra/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      # Expose locally for drizzle-kit studio; remove in prod if using internal network only
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U furniture_user -d furniture_shop"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # Redis 7
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: furniture_redis
    restart: unless-stopped
    # noeviction is required by BullMQ — this Redis serves both the cache
    # (TTL-based, self-trimming) and job queues, which must never be evicted.
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - rdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # Next.js App (prod profile only)
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Migrations — one-shot, runs before the app. Uses the worker image (has
  # drizzle-kit + source). Exits 0 on success.
  # ---------------------------------------------------------------------------
  migrate:
    profiles: ["prod"]
    build:
      context: .
      target: worker
    image: furniture-shop-worker:latest
    container_name: furniture_migrate
    restart: "no"
    env_file: .env.production
    environment:
      NODE_ENV: production
    command: ["npm", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  app:
    profiles: ["prod"]
    build:
      context: .
      target: runner
    image: furniture-shop-app:latest
    container_name: furniture_app
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    networks:
      - internal
      - external
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # Worker — BullMQ consumer (prod profile only)
  # ---------------------------------------------------------------------------
  worker:
    profiles: ["prod"]
    build:
      context: .
      target: worker
    image: furniture-shop-worker:latest
    container_name: furniture_worker
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
    command: ["npm", "run", "start:worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # Caddy — reverse proxy with auto TLS (prod profile only)
  # ---------------------------------------------------------------------------
  caddy:
    profiles: ["prod"]
    image: caddy:2-alpine
    container_name: furniture_caddy
    restart: unless-stopped
    environment:
      # Caddyfile reads {$DOMAIN}; set it in the project-root .env file
      DOMAIN: ${DOMAIN:?set DOMAIN in .env (e.g. shop.example.ru)}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - internal
      - external

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  pgdata:
    driver: local
  rdata:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  internal:
    driver: bridge
  external:
    driver: bridge
